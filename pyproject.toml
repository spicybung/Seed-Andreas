[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-andreas"
version = "0.10.0"
description = "Seeded procedural GTA San Andreas world generator"
requires-python = ">=3.10"

[project.scripts]
seed-andreas = "sanandrais.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sanandrais*"]
